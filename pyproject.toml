[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-advisor"
version = "0.1.0"
description = "Reproducible houseplant advisor baseline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
plant-advisor = "plant_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
